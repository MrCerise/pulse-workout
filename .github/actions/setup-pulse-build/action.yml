name: Set up PULSE build
description: JDK 17, Android SDK platform and build tools (37, falling back to 36/35), and Gradle caching.

runs:
  using: composite
  steps:
    - name: Check UI resources, branding and contrast
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/check_ui.py
        python3 scripts/check_brand.py
        python3 scripts/kotlin_xref_gate.py
        python3 scripts/contrast_check.py
        git diff --exit-code -- docs/CONTRAST.md

    - name: Set up JDK 17
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4.0.4
      with:
        packages: platform-tools

    - name: Install Android platform and build tools
      shell: bash
      run: |
        set -euo pipefail
        # Android 17 (API 37) is the compile target. If this runner's SDK repository does not
        # offer platforms;android-37 yet, fall back to 36 — the app still runs on Android 17
        # devices, it is just compiled against the newest available platform.
        # One sdkmanager call per candidate installs the platform and its build tools together.
        if sdkmanager "platforms;android-37" "build-tools;37.0.0"; then
          compile_sdk=37
        elif sdkmanager "platforms;android-36" "build-tools;36.0.0"; then
          echo "::warning::platforms;android-37 is not available from this runner's SDK repository; falling back to android-36"
          compile_sdk=36
        else
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "::warning::platforms;android-37 and android-36 are not available; falling back to android-35"
          compile_sdk=35
        fi
        echo "PULSE_COMPILE_SDK=${compile_sdk}" >> "$GITHUB_ENV"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6.4.0
