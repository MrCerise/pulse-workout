name: Set up PULSE build
description: JDK 17, Android SDK platform and build tools (37, falling back to 36/35), and Gradle caching.

inputs:
  check-resources:
    description: Run static checks here (disable when an upstream job already checked this source)
    required: false
    default: 'true'
  minimum-api:
    description: Lowest compile SDK accepted by this job (Play phone releases require 36)
    required: false
    default: '35'

runs:
  using: composite
  steps:
    - name: Check UI resources, branding and contrast
      if: inputs.check-resources == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/check_ui.py
        python3 scripts/generate_privacy_policy.py --check
        python3 scripts/check_brand.py
        python3 scripts/kotlin_xref_gate.py
        python3 scripts/contrast_check.py
        git diff --exit-code -- docs/CONTRAST.md

    - name: Set up JDK 17
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4.0.4
      with:
        packages: platform-tools

    - name: Install Android platform and build tools
      shell: bash
      env:
        PULSE_MINIMUM_API: ${{ inputs.minimum-api }}
      run: |
        set -euo pipefail
        # Android 17 (API 37) is the compile target; 36 and 35 are the documented fallbacks, and
        # the app still runs on newer devices when it is compiled against an older platform.
        #
        # The runner image already ships several platforms and build-tools sets, so look on disk
        # first: `sdkmanager` costs a repository round trip per call, and the newest API the
        # project targets is regularly not published for this runner yet — which used to be a
        # guaranteed failing call before every single build.
        #
        # This step is the *preference*, not the only thing keeping a build alive: the root
        # build.gradle.kts resolves compileSdk against what is installed whenever no
        # -Ppulse.compileSdk was passed, which is how a plain `./gradlew assemble` — a code
        # scanner's autobuild, a fresh clone — compiles at all when platforms;android-37 is
        # missing. Here the newest obtainable API is chosen and handed to Gradle explicitly, so a
        # CI run says in its log which platform it used.
        installed() {
          local api="$1"
          [ -n "${ANDROID_SDK_ROOT:-}" ] || return 1
          [ -d "${ANDROID_SDK_ROOT}/platforms/android-${api}" ] || return 1
          compgen -G "${ANDROID_SDK_ROOT}/build-tools/${api}.0*" > /dev/null || return 1
        }

        use() {
          echo "Compiling against platforms;android-${1} / build-tools;${1}.0.0"
          echo "PULSE_COMPILE_SDK=${1}" >> "$GITHUB_ENV"
        }

        # Pass 1: the newest platform this runner already has. No network at all.
        for api in 37 36 35; do
          if (( api < PULSE_MINIMUM_API )); then continue; fi
          if installed "$api"; then
            use "$api"
            exit 0
          fi
        done

        # Pass 2: nothing usable is preinstalled, so ask the SDK repository, newest first.
        for api in 37 36 35; do
          if (( api < PULSE_MINIMUM_API )); then continue; fi
          if sdkmanager "platforms;android-${api}" "build-tools;${api}.0.0"; then
            use "$api"
            exit 0
          fi
          echo "::warning::platforms;android-${api} is not available from this runner's SDK repository; falling back to an older platform"
        done

        echo "::error::no usable Android platform could be installed on this runner" >&2
        exit 1

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6.4.0
      with:
        # Cache entries are branch-scoped, so a pull request branch can only ever read its own
        # entries and the default branch's — never another branch's. Writing them is what makes a
        # second push to the same pull request cheap, and merges to `main` are what keep the whole
        # repository warm. A pull request opened from a fork is left read-only: untrusted code must
        # not be able to plant a cache entry that a later trusted build restores.
        #
        # Tag runs stay read-only too: a cache entry written for a tag is scoped to that tag and
        # nothing else can ever read it, so the storage would be wasted. They still *restore* the
        # default branch's entry, which is what keeps a release build from starting from scratch.
        cache-read-only: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.ref, 'refs/tags/') }}
        # Drop entries the finished build did not touch before saving, so restores stay quick.
        cache-cleanup: on-success
