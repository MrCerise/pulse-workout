name: Build and release

on:
  pull_request:
    branches:
      - main
    # Edits to prose, the licence or the templates cannot change what compiles or what the tests
    # assert, so they skip CI instead of waiting behind a Gradle build. Note that a skipped
    # workflow leaves its checks unreported, which is why `main` carries no required checks.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'crowdin.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/dependabot.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Path filters are not evaluated for tag pushes, so a release is never skipped by this list.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'crowdin.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/dependabot.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to update with a signed build (for example, v1.0.0). Leave empty to run the unit tests on the selected branch.
        required: false
        type: string

# Read-only by default; only the release job needs to write (to attach APKs to a GitHub Release).
permissions:
  contents: read

# A new push to a pull request supersedes the still-running check for that pull request.
# Merges to main and tag/manual release runs are never cancelled: the runs on `main` are what write
# the Gradle caches every branch restores, and a cancelled release run publishes nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resource-checks:
    name: Resource and localization checks
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate resources, branding and references
        run: |
          python3 scripts/check_ui.py
          python3 scripts/check_brand.py
          python3 scripts/kotlin_xref_gate.py
          python3 scripts/contrast_check.py
          git diff --exit-code -- docs/CONTRAST.md

  # The unit tests run as one job per module group, side by side: GitHub gives a public repository
  # as many runners as it has jobs, so the wall-clock cost of a pull request is the slowest job
  # rather than the sum of all of them. Splitting by group also matches where the time actually
  # goes — the phone app takes most of it, the three pure-Kotlin modules almost none — and a
  # failure in one group no longer hides the results of the others.
  unit-tests:
    name: Unit tests (${{ matrix.label }})
    if: >-
      (github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One failing group must not cancel the others: their result is what tells you whether the
      # change is broken everywhere or in one place.
      fail-fast: false
      matrix:
        include:
          - key: jvm
            label: engine, sync, library
            tasks: ':engine:test :sync:test :library:test'
            timeout: 15
          - key: app
            label: app
            tasks: ':app:testDebugUnitTest'
            timeout: 30
          - key: wear
            label: wear
            tasks: ':wear:testDebugUnitTest'
            timeout: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-pulse-build

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          # The build cache is what makes this fast, and it is also what could make it a lie: a
          # Test task can be satisfied from the cache instead of executing. The init script turns
          # that off for the test tasks, and the check below proves it, so the job fails rather
          # than quietly reporting a green run in which no test ran.
          stamp="$(mktemp)"
          bash ./gradlew --console=plain --stacktrace \
            -I .github/ci/no-cached-tests.init.gradle \
            -Ppulse.compileSdk="${PULSE_COMPILE_SDK}" \
            ${{ matrix.tasks }} 2>&1 | tee gradle-build.log
          results="$(find . -path '*/build/test-results/*' -name '*.xml' -newer "$stamp" | wc -l)"
          if [[ "$results" -eq 0 ]]; then
            echo "::error title=No test results were produced::the build passed without writing a single test result file; the test tasks were skipped, so this run proves nothing."
            exit 1
          fi
          echo "::notice title=Unit tests::${results} test result files were written by this run, none restored from the build cache"
          echo "${results} test result files written by this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize failure diagnostics
        if: failure()
        uses: ./.github/actions/summarize-gradle-failure
        with:
          artifact-name: build-logs-${{ github.job }}-${{ matrix.key }}-${{ github.run_id }}

  # --------------------------------------------------------------------------------------------
  # Version preparation — calculate release version information once and share via job outputs.
  # --------------------------------------------------------------------------------------------
  version:
    name: Resolve release version
    if: "startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Resolve version from the tag
        id: version
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Resolve from the requested tag for manual dispatches, never from the selected branch.
          if [[ -n "${RELEASE_TAG_INPUT}" ]]; then
            ref="${RELEASE_TAG_INPUT}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          # The shared scheme (see release-train.yml): versionCode grows monotonically with the
          # semver, so a store upload from a tag can never regress below an earlier build.
          #   versionCode = major*10_000_000 + minor*100_000 + patch*1_000
          # A pre-release tag carries a suffix after the first `-` (v1.8.1-beta1.0): the suffix
          # rides along in the versionName, and the versionCode adds the run number (mod 1000)
          # so two pre-releases of the same core never collide, while a plain tag keeps build 0.
          tag="${ref#v}"
          if [[ "$ref" == v* ]]; then release_tag="$ref"; else release_tag="v$ref"; fi
          core="${tag%%-*}"
          suffix="${tag#*-}"
          IFS='.' read -r major minor patch <<< "$core"
          if [[ -z "${major:-}" || -z "${minor:-}" || -z "${patch:-}" ]] || \
             ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.8.0 or v1.8.1-beta1.0 (got ${ref})."
            exit 1
          fi
          code=$(( major * 10000000 + minor * 100000 + patch * 1000 ))
          if [[ "$suffix" != "$tag" ]]; then
            code=$(( code + GITHUB_RUN_NUMBER % 1000 ))
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$suffix" != "$tag" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release::$tag (versionCode $code)$([[ "$suffix" != "$tag" ]] && echo ' — pre-release')"

  # --------------------------------------------------------------------------------------------
  # Android (phone) build — runs on its own runner, in parallel with the Wear OS build.
  # --------------------------------------------------------------------------------------------
  android-build:
    name: Build Android (phone)
    needs: version
    if: "startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PULSE_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PULSE_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PULSE_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-pulse-build

      - name: Decode release signing key
        shell: bash
        env:
          PULSE_RELEASE_STORE_FILE: ${{ runner.temp }}/pulse-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$PULSE_RELEASE_STORE_PASSWORD" || -z "$PULSE_RELEASE_KEY_ALIAS" || -z "$PULSE_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets before publishing a release."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PULSE_RELEASE_STORE_FILE"

      - name: Build signed APKs
        shell: bash
        env:
          PULSE_RELEASE_STORE_FILE: ${{ runner.temp }}/pulse-release.jks
        run: |
          set -euo pipefail
          bash ./gradlew --console=plain --stacktrace \
            -Ppulse.compileSdk="${PULSE_COMPILE_SDK}" \
            -Ppulse.versionCode="${{ needs.version.outputs.version_code }}" \
            -Ppulse.versionName="${{ needs.version.outputs.version_name }}" \
            :app:assembleDebug :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Stage Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-staging
          cp app/build/outputs/apk/debug/app-debug.apk android-staging/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk android-staging/app-release.apk
          ls -la android-staging/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: android-build-${{ github.run_id }}
          path: android-staging/*
          retention-days: 30
          if-no-files-found: error

      - name: Summarize failure diagnostics
        if: failure()
        uses: ./.github/actions/summarize-gradle-failure
        with:
          artifact-name: build-logs-android-${{ github.run_id }}

  # --------------------------------------------------------------------------------------------
  # Wear OS build — runs on its own runner, in parallel with the Android build.
  # --------------------------------------------------------------------------------------------
  wear-build:
    name: Build Wear OS
    needs: version
    if: "startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PULSE_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PULSE_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PULSE_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-pulse-build

      - name: Decode release signing key
        shell: bash
        env:
          PULSE_RELEASE_STORE_FILE: ${{ runner.temp }}/pulse-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$PULSE_RELEASE_STORE_PASSWORD" || -z "$PULSE_RELEASE_KEY_ALIAS" || -z "$PULSE_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets before publishing a release."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PULSE_RELEASE_STORE_FILE"

      - name: Build signed APKs
        shell: bash
        env:
          PULSE_RELEASE_STORE_FILE: ${{ runner.temp }}/pulse-release.jks
        run: |
          set -euo pipefail
          bash ./gradlew --console=plain --stacktrace \
            -Ppulse.compileSdk="${PULSE_COMPILE_SDK}" \
            -Ppulse.versionCode="${{ needs.version.outputs.version_code }}" \
            -Ppulse.versionName="${{ needs.version.outputs.version_name }}" \
            :wear:assembleDebug :wear:assembleRelease 2>&1 | tee gradle-build.log

      - name: Stage Wear artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wear-staging
          cp wear/build/outputs/apk/debug/wear-debug.apk wear-staging/wear-debug.apk
          cp wear/build/outputs/apk/release/wear-release.apk wear-staging/wear-release.apk
          ls -la wear-staging/

      - name: Upload Wear artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: wear-build-${{ github.run_id }}
          path: wear-staging/*
          retention-days: 30
          if-no-files-found: error

      - name: Summarize failure diagnostics
        if: failure()
        uses: ./.github/actions/summarize-gradle-failure
        with:
          artifact-name: build-logs-wear-${{ github.run_id }}

  # --------------------------------------------------------------------------------------------
  # Publish — wait for both builds, restore filenames, attach to the GitHub Release.
  # --------------------------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [version, android-build, wear-build]
    if: "!cancelled() && needs.version.result == 'success' && needs.android-build.result == 'success' && needs.wear-build.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v6.0.0
        with:
          name: android-build-${{ github.run_id }}
          path: android-staging

      - name: Download Wear artifacts
        uses: actions/download-artifact@v6.0.0
        with:
          name: wear-build-${{ github.run_id }}
          path: wear-staging

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          {
            release_tag="${RELEASE_TAG}"
            echo "release_tag=${release_tag}"
            mkdir -p release-assets
            cp android-staging/app-debug.apk "release-assets/intervals-${release_tag}-debug.apk"
            cp android-staging/app-release.apk "release-assets/intervals-${release_tag}-release.apk"
            cp wear-staging/wear-debug.apk "release-assets/intervals-${release_tag}-wear-debug.apk"
            cp wear-staging/wear-release.apk "release-assets/intervals-${release_tag}-wear-release.apk"
            ls -la release-assets/
          } 2>&1 | tee asset-prep.log

      - name: Attach signed APKs to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          generate_release_notes: true
          overwrite_files: true
          # A tag with a suffix (v1.8.1-beta1.0) is a test build: mark the release as such so it
          # is never mistaken for, or presented as, the latest stable.
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: release-assets/*.apk

      - name: Summarize failure diagnostics
        if: failure()
        uses: ./.github/actions/summarize-gradle-failure
        with:
          artifact-name: build-logs-publish-${{ github.run_id }}
