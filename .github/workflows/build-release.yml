name: Build and release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to update with a signed build (for example, v1.0.0). Leave empty to run the unit tests on the selected branch.
        required: false
        type: string

# Read-only by default; only the release job needs to write (to attach APKs to a GitHub Release).
permissions:
  contents: read

# A new push to a pull request supersedes the still-running check for that pull request.
# Tag and manual release runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests (pull requests)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-pulse-build

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew --console=plain --stacktrace -Ppulse.compileSdk="${PULSE_COMPILE_SDK}" \
            :engine:test :app:testDebugUnitTest 2>&1 | tee gradle-build.log

      - name: Summarize failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Build failure diagnostics"
            if [[ -f gradle-build.log ]]; then
              echo '```text'
              grep -E '^e: |^> Task .*FAILED|^FAILURE:|^BUILD FAILED|Execution failed' gradle-build.log | tail -n 80 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f gradle-build.log ]]; then
            while IFS= read -r line; do
              echo "::error title=Gradle compiler diagnostic::$line"
            done < <(grep '^e: ' gradle-build.log | tail -n 60 || true)
          fi

      - name: Upload build logs when a job fails
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-logs-${{ github.run_id }}
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Build signed release APKs
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PULSE_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PULSE_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PULSE_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-pulse-build

      - name: Decode release signing key
        shell: bash
        env:
          PULSE_RELEASE_STORE_FILE: ${{ runner.temp }}/pulse-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$PULSE_RELEASE_STORE_PASSWORD" || -z "$PULSE_RELEASE_KEY_ALIAS" || -z "$PULSE_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets before publishing a release."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PULSE_RELEASE_STORE_FILE"

      - name: Build signed APKs
        shell: bash
        env:
          PULSE_RELEASE_STORE_FILE: ${{ runner.temp }}/pulse-release.jks
        run: |
          set -euo pipefail
          bash ./gradlew --console=plain --stacktrace -Ppulse.compileSdk="${PULSE_COMPILE_SDK}" \
            :app:assembleDebug :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          {
            release_tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
            echo "release_tag=${release_tag}"
            ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/ 2>&1
            mkdir -p release-assets
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/pulse-${release_tag}-debug.apk"
            cp app/build/outputs/apk/release/app-release.apk "release-assets/pulse-${release_tag}-release.apk"
            ls -la release-assets/
          } 2>&1 | tee asset-prep.log

      - name: Attach signed APKs to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: release-assets/*.apk

      - name: Summarize failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Build failure diagnostics"
            if [[ -f gradle-build.log ]]; then
              echo '```text'
              grep -E '^e: |^> Task .*FAILED|^FAILURE:|^BUILD FAILED|Execution failed' gradle-build.log | tail -n 80 || true
              echo '```'
            fi
            if [[ -f asset-prep.log ]]; then
              echo '```text'
              tail -n 40 asset-prep.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f gradle-build.log ]]; then
            while IFS= read -r line; do
              echo "::error title=Gradle compiler diagnostic::$line"
            done < <(grep '^e: ' gradle-build.log | tail -n 60 || true)
          fi

      - name: Upload build logs when a job fails
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            gradle-build.log
            asset-prep.log
          if-no-files-found: ignore
          retention-days: 7
