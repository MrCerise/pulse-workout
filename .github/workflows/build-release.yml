name: Build and release

on:
  pull_request:
    branches:
      - main
    # Edits to prose, the licence or the templates cannot change what compiles or what the tests
    # assert, so they skip CI instead of waiting behind a Gradle build. Note that a skipped
    # workflow leaves its checks unreported, which is why `main` carries no required checks.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'crowdin.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/dependabot.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Path filters are not evaluated for tag pushes, so a release is never skipped by this list.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'crowdin.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/dependabot.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to update with a signed build (for example, v1.0.0). Leave empty to run the unit tests on the selected branch.
        required: false
        type: string

# Read-only by default; only the release job needs to write (to attach APKs to a GitHub Release).
permissions:
  contents: read

# A new push to a pull request supersedes the still-running check for that pull request.
# Merges to main and tag/manual release runs are never cancelled: the runs on `main` are what write
# the Gradle caches every branch restores, and a cancelled release run publishes nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resource-checks:
    name: Resource and localization checks
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate resources, branding and references
        run: |
          python3 scripts/check_ui.py
          python3 scripts/check_brand.py
          python3 scripts/kotlin_xref_gate.py
          python3 scripts/contrast_check.py
          git diff --exit-code -- docs/CONTRAST.md

  # The unit tests run as one job per module group, side by side: GitHub gives a public repository
  # as many runners as it has jobs, so the wall-clock cost of a pull request is the slowest job
  # rather than the sum of all of them. Splitting by group also matches where the time actually
  # goes — the phone app takes most of it, the three pure-Kotlin modules almost none — and a
  # failure in one group no longer hides the results of the others.
  unit-tests:
    name: Unit tests (${{ matrix.label }})
    if: >-
      (github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One failing group must not cancel the others: their result is what tells you whether the
      # change is broken everywhere or in one place.
      fail-fast: false
      matrix:
        include:
          - key: jvm
            label: engine, sync, library
            tasks: ':engine:test :sync:test :library:test'
            timeout: 15
          - key: app
            label: app
            tasks: ':app:testDebugUnitTest'
            timeout: 30
          - key: wear
            label: wear
            tasks: ':wear:testDebugUnitTest'
            timeout: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-pulse-build

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          # The build cache is what makes this fast, and it is also what could make it a lie: a
          # Test task can be satisfied from the cache instead of executing. The init script turns
          # that off for the test tasks, and the check below proves it, so the job fails rather
          # than quietly reporting a green run in which no test ran.
          stamp="$(mktemp)"
          bash ./gradlew --console=plain --stacktrace \
            -I .github/ci/no-cached-tests.init.gradle \
            -Ppulse.compileSdk="${PULSE_COMPILE_SDK}" \
            ${{ matrix.tasks }} 2>&1 | tee gradle-build.log
          results="$(find . -path '*/build/test-results/*' -name '*.xml' -newer "$stamp" | wc -l)"
          if [[ "$results" -eq 0 ]]; then
            echo "::error title=No test results were produced::the build passed without writing a single test result file; the test tasks were skipped, so this run proves nothing."
            exit 1
          fi
          echo "::notice title=Unit tests::${results} test result files were written by this run, none restored from the build cache"
          echo "${results} test result files written by this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize failure diagnostics
        if: failure()
        uses: ./.github/actions/summarize-gradle-failure
        with:
          artifact-name: build-logs-${{ github.job }}-${{ matrix.key }}-${{ github.run_id }}

  release:
    name: Build signed release APKs
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PULSE_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PULSE_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PULSE_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-pulse-build

      - name: Decode release signing key
        shell: bash
        env:
          PULSE_RELEASE_STORE_FILE: ${{ runner.temp }}/pulse-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$PULSE_RELEASE_STORE_PASSWORD" || -z "$PULSE_RELEASE_KEY_ALIAS" || -z "$PULSE_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets before publishing a release."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PULSE_RELEASE_STORE_FILE"

      - name: Build signed APKs
        shell: bash
        env:
          PULSE_RELEASE_STORE_FILE: ${{ runner.temp }}/pulse-release.jks
        run: |
          set -euo pipefail
          bash ./gradlew --console=plain --stacktrace -Ppulse.compileSdk="${PULSE_COMPILE_SDK}" \
            :app:assembleDebug :app:assembleRelease \
            :wear:assembleDebug :wear:assembleRelease 2>&1 | tee gradle-build.log

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          {
            release_tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
            echo "release_tag=${release_tag}"
            ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/ \
              wear/build/outputs/apk/debug/ wear/build/outputs/apk/release/ 2>&1
            mkdir -p release-assets
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/pulse-${release_tag}-debug.apk"
            cp app/build/outputs/apk/release/app-release.apk "release-assets/pulse-${release_tag}-release.apk"
            cp wear/build/outputs/apk/debug/wear-debug.apk "release-assets/pulse-${release_tag}-wear-debug.apk"
            cp wear/build/outputs/apk/release/wear-release.apk "release-assets/pulse-${release_tag}-wear-release.apk"
            ls -la release-assets/
          } 2>&1 | tee asset-prep.log

      - name: Attach signed APKs to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: release-assets/*.apk

      - name: Summarize failure diagnostics
        if: failure()
        uses: ./.github/actions/summarize-gradle-failure
        with:
          artifact-name: build-logs-${{ github.job }}-${{ github.run_id }}
