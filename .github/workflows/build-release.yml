name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to update with a signed build (for example, v1.0.0)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APKs (tests on PRs)
    runs-on: ubuntu-latest
    env:
      PULSE_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PULSE_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PULSE_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK platform (37, falling back to 36)
        shell: bash
        run: |
          set -euo pipefail
          # Android 17 (API 37) is the compile target. If this runner's SDK repository does not
          # offer platforms;android-37 yet, fall back to 36 — the app still runs on Android 17
          # devices, it is just compiled against the newest available platform.
          if sdkmanager "platforms;android-37"; then
            echo "PULSE_COMPILE_SDK=37" >> "$GITHUB_ENV"
          else
            echo "::warning::platforms;android-37 is not available from this runner's SDK repository; falling back to the newest available platform"
            if sdkmanager "platforms;android-36"; then
              echo "PULSE_COMPILE_SDK=36" >> "$GITHUB_ENV"
            else
              sdkmanager "platforms;android-35"
              echo "PULSE_COMPILE_SDK=35" >> "$GITHUB_ENV"
            fi
          fi

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;37.0.0" || sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Prepare release signing key
        shell: bash
        env:
          PULSE_RELEASE_STORE_FILE: ${{ runner.temp }}/pulse-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* || ( "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$RELEASE_TAG" ) ]]; then
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$PULSE_RELEASE_STORE_PASSWORD" || -z "$PULSE_RELEASE_KEY_ALIAS" || -z "$PULSE_RELEASE_KEY_PASSWORD" ]]; then
              echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets before publishing a release."
              exit 1
            fi
          fi
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PULSE_RELEASE_STORE_FILE"
          fi

      - name: Run tests (pull requests only)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          compile_sdk="${PULSE_COMPILE_SDK:-37}"
          bash ./gradlew --no-daemon --console=plain "--stacktrace" "-Ppulse.compileSdk=${compile_sdk}" "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC -Dfile.encoding=UTF-8" :engine:test :app:testDebugUnitTest 2>&1 | tee gradle-build.log

      - name: Build APKs
        shell: bash
        env:
          PULSE_RELEASE_STORE_FILE: ${{ runner.temp }}/pulse-release.jks
        run: |
          set -euo pipefail
          compile_sdk="${PULSE_COMPILE_SDK:-37}"
          bash ./gradlew --no-daemon --console=plain "--stacktrace" "-Ppulse.compileSdk=${compile_sdk}" "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC -Dfile.encoding=UTF-8" :app:assembleDebug :app:assembleRelease 2>&1 | tee -a gradle-build.log

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        run: |
          set -euo pipefail
          {
            release_tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
            echo "release_tag=${release_tag}"
            ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/ 2>&1
            mkdir -p release-assets
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/pulse-${release_tag}-debug.apk"
            cp app/build/outputs/apk/release/app-release.apk "release-assets/pulse-${release_tag}-release.apk"
            ls -la release-assets/
          } 2>&1 | tee asset-prep.log

      - name: Attach signed APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: release-assets/*.apk

      - name: Summarize failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Build failure diagnostics"
            if [[ -f gradle-build.log ]]; then
              echo '```text'
              grep -E '^e: |^> Task .*FAILED|^FAILURE:|^BUILD FAILED|Execution failed' gradle-build.log | tail -n 80 || true
              echo '```'
            fi
            if [[ -f asset-prep.log ]]; then
              echo '```text'
              tail -n 40 asset-prep.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f gradle-build.log ]]; then
            while IFS= read -r line; do
              echo "::error title=Gradle compiler diagnostic::$line"
            done < <(grep '^e: ' gradle-build.log | tail -n 60 || true)
          fi

      - name: Upload build logs when a job fails
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            gradle-build.log
            asset-prep.log
          if-no-files-found: ignore
          retention-days: 7
