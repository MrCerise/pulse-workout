name: Crowdin translations

on:
  push:
    branches: [main]
    paths:
      - app/src/main/res/values/strings.xml
      - crowdin.yml
      - .github/workflows/crowdin.yml
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      seed_translations:
        description: Import existing translations into Crowdin (first setup only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crowdin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run privileged synchronization from a feature branch.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check Crowdin configuration
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_GITHUB_TOKEN: ${{ secrets.CROWDIN_GITHUB_TOKEN }}
        run: |
          for name in CROWDIN_PROJECT_ID CROWDIN_PERSONAL_TOKEN CROWDIN_GITHUB_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name; see docs/TRANSLATING.md."
              exit 1
            fi
          done
      - name: Synchronize sources and open a translation PR
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_translations }}
          auto_approve_imported: false
          download_translations: true
          skip_untranslated_strings: false
          export_only_approved: true
          localization_branch_name: l10n/crowdin
          create_pull_request: true
          pull_request_base_branch_name: main
          pull_request_title: 'Update Crowdin translations'
          pull_request_body: 'Approved translations from https://crowdin.com/project/pulse-workout. Review and wait for CI before merging.'
          commit_message: 'Update Crowdin translations'
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          # A bot token (rather than GITHUB_TOKEN) lets translation PRs trigger CI.
          GITHUB_TOKEN: ${{ secrets.CROWDIN_GITHUB_TOKEN }}
