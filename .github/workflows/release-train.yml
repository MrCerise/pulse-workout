name: Release train

# One signed build per platform feeds both GitHub Releases and Google Play.
# Tags are routed here by build-release.yml; dispatch supports testing/production.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Play destination (beta is OPEN testing; closed uses play_track)
        required: true
        default: closed
        type: choice
        options: [internal, closed, beta, production]
      play_track:
        description: 'Closed testing only: exact API track name, e.g. PreRelease Beta'
        required: false
        default: 'PreRelease Beta'
        type: string
      release_tag:
        description: 'Optional existing tag; select that tag under Run workflow > Use workflow from'
        required: false
        type: string
      version_name:
        description: 'MAJOR.MINOR.PATCH; empty uses the tag or repository version'
        required: false
        type: string
      version_code:
        description: 'Integer higher than ALL previous Play uploads; tags can derive one if empty'
        required: false
        type: string
      publish_to_play:
        description: Upload phone AAB to Play; GitHub assets are published either way
        required: true
        default: true
        type: boolean
      release_status:
        description: Draft for review, or completed to release to the selected track
        required: true
        default: draft
        type: choice
        options: [draft, completed]
      staged_rollout_percent:
        description: 'Production + completed only: integer 1-100'
        default: '100'
        type: string
      run_tests:
        description: Run unit tests in the build jobs (always enabled for production)
        default: true
        type: boolean
  workflow_call:
    inputs:
      channel:
        type: string
        default: closed
      play_track:
        type: string
        default: 'PreRelease Beta'
      release_tag:
        type: string
        default: ''
      version_name:
        type: string
        default: ''
      version_code:
        type: string
        default: ''
      publish_to_play:
        type: boolean
        default: true
      release_status:
        type: string
        default: draft
      staged_rollout_percent:
        type: string
        default: '100'
      run_tests:
        type: boolean
        default: true

permissions:
  contents: read

# All tracks edit the same Play application. Never cancel a publishing run.
concurrency:
  group: release-train-play
  cancel-in-progress: false

jobs:
  version:
    name: Validate release and source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      full_version_name: ${{ steps.version.outputs.full_name }}
      release_status: ${{ steps.version.outputs.status }}
      user_fraction: ${{ steps.version.outputs.fraction }}
      track: ${{ steps.version.outputs.track }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release inputs
        id: version
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_PLAY_TRACK: ${{ inputs.channel == 'closed' && inputs.play_track || '' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          RELEASE_ROLLOUT_PERCENT: ${{ inputs.staged_rollout_percent }}
        run: python3 scripts/resolve_play_release.py
      - name: Validate the selected workflow commit
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          SOURCE_TAG: ${{ inputs.release_tag }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: python3 scripts/validate_release_source.py
      - name: Static checks and release helper tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_ui.py
          python3 scripts/generate_privacy_policy.py --check
          python3 scripts/check_brand.py
          python3 scripts/kotlin_xref_gate.py
          python3 scripts/contrast_check.py
          git diff --exit-code -- docs/CONTRAST.md
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Prepare versioned GitHub and Play release notes
        env:
          RELEASE_NOTES_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_NOTES_OUTPUT: ${{ runner.temp }}/release-notes
        run: python3 scripts/prepare_release_notes.py
      - name: Share the validated release notes
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/release-notes/
          if-no-files-found: error
          retention-days: 30

  build:
    name: Test and build ${{ matrix.label }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: app
            label: Android phone
            platform: phone
            tests: ':engine:test :sync:test :library:test :app:testDebugUnitTest'
          - module: wear
            label: Wear OS
            platform: wear
            tests: ':wear:testDebugUnitTest'
    env:
      PULSE_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PULSE_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PULSE_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up build environment
        uses: ./.github/actions/setup-pulse-build
        with:
          minimum-api: '36'
          check-resources: 'false'
      - name: Decode upload signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$PULSE_RELEASE_STORE_PASSWORD" || -z "$PULSE_RELEASE_KEY_ALIAS" || -z "$PULSE_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/pulse-release.jks"
      - name: Run tests and build signed AAB and APK
        shell: bash
        env:
          PULSE_RELEASE_STORE_FILE: ${{ runner.temp }}/pulse-release.jks
          MODULE: ${{ matrix.module }}
          TEST_TASKS: ${{ matrix.tests }}
          RUN_TESTS: ${{ inputs.run_tests || inputs.channel == 'production' }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
          VERSION_NAME: ${{ needs.version.outputs.full_version_name }}
        run: |
          set -euo pipefail
          stamp="$(mktemp)"
          tasks=()
          if [[ "$RUN_TESTS" == 'true' ]]; then read -r -a tasks <<< "$TEST_TASKS"; fi
          bash ./gradlew --console=plain --stacktrace \
            -I .github/ci/no-cached-tests.init.gradle \
            -Ppulse.compileSdk="$PULSE_COMPILE_SDK" -Ppulse.playRelease=true \
            -Ppulse.versionCode="$VERSION_CODE" -Ppulse.versionName="$VERSION_NAME" \
            "${tasks[@]}" ":${MODULE}:bundleRelease" ":${MODULE}:assembleRelease" 2>&1 | tee gradle-build.log
          if [[ "$RUN_TESTS" == 'true' ]]; then
            results="$(find . -path '*/build/test-results/*' -name '*.xml' -newer "$stamp" | wc -l)"
            if [[ "$results" -eq 0 ]]; then
              echo "::error::Tests were requested but this run produced no fresh test results."
              exit 1
            fi
            echo "${results} fresh test result files; test results were not restored from cache." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage signed artifacts
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
          PLATFORM: ${{ matrix.platform }}
          VERSION_NAME: ${{ needs.version.outputs.full_version_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          prefix="interval-coach-${VERSION_NAME}-${PLATFORM}"
          cp "$MODULE/build/outputs/bundle/release/${MODULE}-release.aab" "release-assets/${prefix}-release.aab"
          cp "$MODULE/build/outputs/apk/release/${MODULE}-release.apk" "release-assets/${prefix}-release.apk"
          cp "$MODULE/build/outputs/mapping/release/mapping.txt" "release-assets/${prefix}-mapping.txt"
      - name: Upload signed artifacts once
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ matrix.module }}
          path: release-assets/*
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Summarize failure diagnostics
        if: failure()
        uses: ./.github/actions/summarize-gradle-failure
        with:
          artifact-name: build-logs-${{ matrix.module }}-${{ github.run_id }}
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f -- "${RUNNER_TEMP}/pulse-release.jks"

  github-release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download phone and watch artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-${{ github.run_id }}-*
          merge-multiple: true
          path: release-assets
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.apk *.aab *-mapping.txt > SHA256SUMS
      - name: Download the validated release notes
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes-${{ github.run_id }}
          path: release-notes
      - name: Publish all signed assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes/github.md
          generate_release_notes: true
          overwrite_files: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/*-mapping.txt
            release-assets/SHA256SUMS

  play:
    name: Upload Play ${{ needs.version.outputs.track }} (${{ needs.version.outputs.release_status }})
    needs: [version, build]
    if: inputs.publish_to_play
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.channel == 'production' && 'play-production' || 'play-testing' }}
    env:
      HAS_PLAY_ACCESS: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Check Play credentials
        shell: bash
        run: |
          if [[ "$HAS_PLAY_ACCESS" != 'true' ]]; then
            echo "::error::Add ANDROID_SERVICE_ACCOUNT_JSON (plain service-account JSON) to this Play environment or the repository. GitHub Release publishing is independent and will still complete."
            exit 1
          fi
      - name: Download the same signed phone bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-${{ github.run_id }}-app
          path: release-assets
      - name: Download the validated release notes
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes-${{ github.run_id }}
          path: release-notes
      - name: Upload phone AAB and R8 mapping
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: com.mrcerise.intervalcoach
          releaseFiles: release-assets/interval-coach-${{ needs.version.outputs.full_version_name }}-phone-release.aab
          releaseName: ${{ needs.version.outputs.full_version_name }}
          mappingFile: release-assets/interval-coach-${{ needs.version.outputs.full_version_name }}-phone-mapping.txt
          whatsNewDirectory: release-notes/whatsnew
          track: ${{ needs.version.outputs.track }}
          status: ${{ needs.version.outputs.release_status }}
          inAppUpdatePriority: ${{ inputs.channel == 'production' && 3 || 0 }}
          userFraction: ${{ needs.version.outputs.user_fraction }}
      - name: Summarize Play upload
        env:
          VERSION_NAME: ${{ needs.version.outputs.full_version_name }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
          TRACK: ${{ needs.version.outputs.track }}
          STATUS: ${{ needs.version.outputs.release_status }}
        run: |
          {
            echo "Version: ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo "Play track: ${TRACK}; status: ${STATUS}"
            echo "This is the same phone AAB published to GitHub Releases. Wear OS AAB/APK and both mappings are also on the GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
