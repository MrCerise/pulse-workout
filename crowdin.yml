# https://crowdin.com/project/pulse-workout
# Authentication and repository synchronization are managed by Crowdin's GitHub integration.
base_path: .
preserve_hierarchy: true

files:
  - source: /app/src/main/res/values/strings.xml
    translation: /app/src/main/res/values-%android_code%/strings.xml
    languages_mapping:
      android_code:
        fr: fr-rFR
    type: android
    skip_untranslated_strings: false
    export_only_approved: true
  - source: /app/src/main/res/values/journey.xml
    translation: /app/src/main/res/values-%android_code%/journey.xml
    languages_mapping:
      android_code:
        fr: fr-rFR
    type: android
    skip_untranslated_strings: true
    export_only_approved: true
