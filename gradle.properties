# PULSE — build config sized for GitHub-hosted runners (4 vCPU / 16 GB) and a normal workstation.
# On a small machine (4 GB RAM or less), lower org.gradle.jvmargs to -Xmx1536m and set
# org.gradle.parallel=false.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
