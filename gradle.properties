# PULSE — build config tuned for constrained CI/dev boxes as well as normal workstations.
# If you have plenty of RAM, raise org.gradle.jvmargs to -Xmx4g and drop the in-process flag.
# 2 GiB CI boxes: keep the daemon small and pin thread counts so peak memory stays under ~1 GB.
# On a normal workstation -Xmx4g with parallel builds is fine.
org.gradle.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
