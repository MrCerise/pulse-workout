# PULSE Interval Coach — pinned dependency versions (verified available 2026-10-07)
[versions]
# 8.9.1 is the minimum accepted by androidx.health.connect:connect-client:1.1.0 (enforced by its
# AAR metadata check at build time); 8.7.3 failed CI with "requires Android Gradle plugin 8.9.1".
agp = "8.9.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigation = "2.8.4"
room = "2.6.1"
datastore = "1.1.1"
media3 = "1.4.1"
coroutines = "1.9.0"
serialization = "1.7.3"
documentfile = "1.0.1"
work = "2.9.1"
healthConnect = "1.1.0"
playServicesFitness = "21.3.0"
playServicesAuth = "21.2.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
mockk = "1.13.13"
sqliteJdbc = "3.46.1.3"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
